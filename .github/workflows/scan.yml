name: Crypto spread scanner

on:
  schedule:
    - cron: '2/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-spread-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out scanner
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Restore signal state
        uses: actions/cache/restore@v4
        with:
          path: scanner-state.json
          key: scanner-state-${{ github.run_id }}
          restore-keys: scanner-state-

      - name: Install dependencies
        run: python -m pip install ccxt requests

      - name: Scan and send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_FILE: scanner-state.json
        run: python scanner.py

      - name: Save signal state
        if: always() && hashFiles('scanner-state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: scanner-state.json
          key: scanner-state-${{ github.run_id }}
